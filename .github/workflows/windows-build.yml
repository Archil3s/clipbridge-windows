name: Build and package Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: clipbridge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check version consistency
        run: python scripts/check_version.py
      - name: Restore
        run: dotnet restore src/ClipBridge/ClipBridge.csproj
      - name: Test local bridge, optional monitoring and B-roll library
        run: dotnet run --project tests/ClipBridge.Core.Tests -c Release
      - name: Test extension authorization and transfer protocol
        run: node --test tests/brave-extension/extension.test.cjs
      - name: Install existing browser-test dependencies
        working-directory: cloudflare-dashboard
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install isolated Chromium test browser
        working-directory: cloudflare-dashboard
        run: npx playwright install chromium
      - name: Test real MV3 transport against local bridge and synthetic page
        run: |
          node tests/brave-extension/composer-browser.cjs
          if ($LASTEXITCODE -ne 0) { throw "Composer regression tests failed" }
          node tests/brave-extension/browser-transport.cjs
      - name: Publish Windows desktop app
        run: dotnet publish src/ClipBridge/ClipBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish -warnaserror
      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ClipBridge-win-x64-portable
          path: publish/**
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found at $compiler" }
          & $compiler "installer\ClipBridge.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ClipBridge-Installer
          path: installer-output/ClipBridge-Setup.exe
      - name: Verify Brave extension JavaScript
        shell: pwsh
        run: |
          node --check brave-extension/background.js
          if ($LASTEXITCODE -ne 0) { throw "Brave extension worker syntax error" }
          node --check brave-extension/composer.js
          if ($LASTEXITCODE -ne 0) { throw "Brave composer.js syntax error" }
          node --check brave-extension/content.js
          if ($LASTEXITCODE -ne 0) { throw "Brave extension content.js syntax error" }
          node --check brave-extension/popup.js
          if ($LASTEXITCODE -ne 0) { throw "Brave extension popup.js syntax error" }
      - name: Upload Brave auto-attach extension
        uses: actions/upload-artifact@v4
        with:
          name: ClipBridge-Brave-Extension
          path: |
            brave-extension/manifest.json
            brave-extension/background.js
            brave-extension/composer.js
            brave-extension/content.js
            brave-extension/popup.js
            brave-extension/popup.html
            brave-extension/README.md
      - name: Package release portable ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath ClipBridge-win-x64-portable.zip
      - name: Publish GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" installer-output/ClipBridge-Setup.exe ClipBridge-win-x64-portable.zip --title "ClipBridge ${{ github.ref_name }}" --generate-notes
