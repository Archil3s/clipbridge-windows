name: Build and package Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: clipbridge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check version consistency
        run: python scripts/check_version.py
      - name: Restore
        run: dotnet restore src/ClipBridge/ClipBridge.csproj
      - name: Publish Windows desktop app
        run: dotnet publish src/ClipBridge/ClipBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish
      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ClipBridge-win-x64-portable
          path: publish/**
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found at $compiler" }
          & $compiler "installer\ClipBridge.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ClipBridge-Installer
          path: installer-output/ClipBridge-Setup.exe
      - name: Package release portable ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath ClipBridge-win-x64-portable.zip
      - name: Publish GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" installer-output/ClipBridge-Setup.exe ClipBridge-win-x64-portable.zip --title "ClipBridge ${{ github.ref_name }}" --generate-notes
