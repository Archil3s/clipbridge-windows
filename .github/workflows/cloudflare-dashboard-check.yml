name: Check Cloudflare dashboard

on:
  push:
    branches: [main, feature/cloudflare-dashboard]
    paths:
      - "cloudflare-dashboard/**"
      - ".github/workflows/cloudflare-dashboard-check.yml"
  pull_request:
    paths:
      - "cloudflare-dashboard/**"
      - ".github/workflows/cloudflare-dashboard-check.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project JavaScript syntax and configuration
        shell: bash
        run: |
          node --check cloudflare-dashboard/src/index.js
          node --check cloudflare-dashboard/public/app.js
          python - <<'PY'
          import json
          with open('cloudflare-dashboard/wrangler.jsonc', encoding='utf-8') as file:
              config = json.load(file)
          assert config['name'] == 'clipbridge-windows'
          assert config['assets']['directory'] == './public'
          print('Cloudflare Worker configuration and JavaScript syntax validated.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dashboard test dependencies
        working-directory: cloudflare-dashboard
        run: npm install --no-audit --no-fund
      - name: Install Chromium for browser tests
        working-directory: cloudflare-dashboard
        run: npx playwright install --with-deps chromium
      - name: Test dashboard on desktop and phone
        working-directory: cloudflare-dashboard
        run: npm run test:ui
